name: Deploy to staging

on:
  push:
    branches: [main-light]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to staging branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          # Set up git credentials
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Use GitHub token for authentication
          git config --global url."https://github-actions:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

          # Store the current commit hash
          COMMIT_HASH=$(git rev-parse --short HEAD)

          # Create temporary directory for dist files
          mkdir -p /tmp/staging-dist
          cp -r dist/* /tmp/staging-dist/

          # Try to fetch existing staging branch
          git fetch origin staging 2>/dev/null || true

          # Create and switch to staging branch
          if git rev-parse --verify origin/staging 2>/dev/null; then
            git checkout -b staging --track origin/staging
          else
            git checkout --orphan staging
          fi

          # Clear the working directory except .git
          find . -maxdepth 1 -not -name '.git' -type f -delete
          find . -maxdepth 1 -not -name '.git' -type d ! -name '.' -exec rm -rf {} + 2>/dev/null || true

          # Copy dist files back
          cp -r /tmp/staging-dist/* .

          # Add and commit files
          git add -A || { echo "Failed to add files"; exit 1; }
          git commit -m "Deploy build from commit ${COMMIT_HASH}" || { echo "No changes to commit"; }

          # Push to remote
          git push -u origin staging 2>&1 || { echo "Push failed with: $?"; exit 1; }
