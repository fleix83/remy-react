name: Deploy to staging

on:
  push:
    branches: [main-light]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to staging branch
        run: |
          # Configure git (use local config, don't override checkout credentials)
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Store the current commit hash
          COMMIT_HASH=$(git rev-parse --short HEAD)

          # Create and switch to staging branch
          git checkout --orphan staging || { echo "Failed to create orphan branch"; exit 1; }

          # Remove all files except .git and dist
          find . -maxdepth 1 -not -name '.git' -not -name 'dist' -not -name '.' -not -name '..' -exec rm -rf {} + 2>/dev/null || true

          # Move dist contents to root
          if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            mv dist/* . 2>/dev/null || true
            mv dist/.* . 2>/dev/null || true
            rmdir dist 2>/dev/null || true
          else
            echo "Error: dist directory is empty or doesn't exist"
            ls -la
            exit 1
          fi

          # Add and commit files
          git add -A || { echo "Failed to add files"; exit 1; }
          git commit -m "Deploy build from commit ${COMMIT_HASH}" || { echo "Failed to commit"; exit 1; }

          # Debug: show git remote
          echo "=== Git Remote ==="
          git remote -v

          # Push to remote (uses credentials from persist-credentials)
          git push -f origin staging || { echo "Failed to push to staging"; exit 1; }
