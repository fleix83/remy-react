name: Deploy to staging

on:
  push:
    branches: [main-light]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to staging branch
        run: |
          # Configure git
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Store the current commit hash
          COMMIT_HASH=$(git rev-parse --short HEAD)

          # Create and switch to staging branch
          git checkout --orphan staging

          # Remove all files except .git and dist
          find . -maxdepth 1 -type f -delete
          find . -maxdepth 1 -type d -not -name '.git' -not -name 'dist' -not -name '.' -not -name '..' -delete

          # Move dist contents to root
          if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            cp -r dist/* .
            [ -f "dist/.htaccess" ] && cp dist/.htaccess .
            rm -rf dist
          else
            echo "Error: dist directory is empty or doesn't exist"
            exit 1
          fi

          # Add and commit files
          git add -A
          git commit -m "Deploy build from commit ${COMMIT_HASH}"

          # Push to remote
          git push -f origin staging
