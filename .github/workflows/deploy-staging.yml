name: Deploy to staging

on:
  push:
    branches: [main-light]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to staging branch
        run: |
          # Configure git
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Store the current commit hash
          COMMIT_HASH=$(git rev-parse --short HEAD)

          # Check if dist exists and has content
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Error: dist directory is empty or doesn't exist"
            ls -la
            exit 1
          fi

          # Create a temporary directory for dist files
          mkdir -p /tmp/dist_staging
          cp -r dist/* /tmp/dist_staging/
          cp .htaccess /tmp/dist_staging/ 2>/dev/null || true

          # Switch to or create staging branch (fetch first to ensure we have latest)
          git fetch origin staging 2>/dev/null || true
          git checkout -B staging origin/staging 2>/dev/null || git checkout --orphan staging

          # Clear working directory (keep .git)
          find . -maxdepth 1 -type f -delete
          find . -maxdepth 1 -type d -not -name '.' -not -name '.git' -exec rm -rf {} + 2>/dev/null || true

          # Copy dist files back
          cp -r /tmp/dist_staging/* .

          # Add all files
          git add -A

          # Commit (allow empty commit if no changes)
          git commit -m "Deploy build from commit ${COMMIT_HASH}" --allow-empty || true

          # Push to remote
          git push -f origin staging
