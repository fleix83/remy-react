name: Deploy to staging

on:
  push:
    branches: [main-light]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to staging branch
        run: |
          # Configure git
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Store the current commit hash
          COMMIT_HASH=$(git rev-parse --short HEAD)

          # Check if dist exists and has content
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Error: dist directory is empty or doesn't exist"
            exit 1
          fi

          # Save dist folder to temp location
          mkdir -p /tmp/dist_temp
          cp -r dist/* /tmp/dist_temp/
          [ -f "dist/.htaccess" ] && cp dist/.htaccess /tmp/dist_temp/

          # Reset to fresh state and create orphan branch
          git reset --hard HEAD
          git clean -fd

          # Create brand new orphan branch
          git symbolic-ref HEAD refs/heads/staging
          rm -f .git/index
          git clean -fd

          # Copy dist files to root
          cp -r /tmp/dist_temp/* .

          # Stage, commit and push
          git add -A
          git commit -m "Deploy build from commit ${COMMIT_HASH}"

          # Force push to remote
          git push -f --set-upstream origin staging
