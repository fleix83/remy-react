name: Deploy to staging

on:
  push:
    branches: [main-light]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to staging branch
        run: |
          # Configure git
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Store the current commit hash
          COMMIT_HASH=$(git rev-parse --short HEAD)

          # Check if dist exists and has content
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Error: dist directory is empty or doesn't exist"
            exit 1
          fi

          # Create temp directory and copy dist + .htaccess
          TEMP_DIR=$(mktemp -d)
          cp -r dist/* "$TEMP_DIR/"
          cp dist/.htaccess "$TEMP_DIR/" 2>/dev/null || true

          # Create clean staging branch using subtree
          git subtree split --prefix dist -b staging-temp
          git push -f origin staging-temp:staging

          # Clean up temp branch
          git branch -D staging-temp || true
