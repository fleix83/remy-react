name: Deploy to staging

on:
  push:
    branches: [main-light]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to staging branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          COMMIT_HASH=$(git rev-parse --short HEAD)

          # Verify dist exists
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Error: dist directory is empty or doesn't exist"
            exit 1
          fi

          # Save current working directory
          WORK_DIR=$(pwd)

          # Create a completely separate git repo in temp for staging
          DEPLOY_DIR=$(mktemp -d)
          cd "$DEPLOY_DIR"

          # Initialize new repo
          git init
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Copy files from original dist
          cp -r "$WORK_DIR/dist"/* .

          # Initial commit
          git add -A
          git commit -m "Deploy build from commit ${COMMIT_HASH}"

          # Add remote and push
          git remote add origin "https://github.com/${{ github.repository }}.git"

          # Push to staging branch
          git push -f origin HEAD:staging

          # Cleanup
          cd "$WORK_DIR"
          rm -rf "$DEPLOY_DIR"
