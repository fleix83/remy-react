name: Deploy to dist-light
on:
  push:
    branches: [main-light]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy to dist-light
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git checkout -B dist-light
          # Remove all files except .git and dist
          find . -maxdepth 1 -not -name '.git' -not -name 'dist' -not -name '.' -not -name '..' -exec rm -rf {} +
          # Move dist contents to root
          mv dist/* .
          rmdir dist
          git add .
          git commit -m "Deploy build from commit $(git rev-parse --short HEAD)"
          git push -f origin dist-light